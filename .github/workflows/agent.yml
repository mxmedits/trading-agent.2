name: agent

# Runs the trading agent on GitHub's free computers.
# Each run queues the next one: every 5 minutes while US markets can be open, every 30 minutes otherwise.
# GitHub's own schedule below is a second way to start it, and it restarts the chain if it ever breaks.
# Only one "next" wait is kept at a time, so there is never more than one chain. Times are UTC.
on:
  push:
    branches: [main]
    paths: [".github/workflows/agent.yml"]
  schedule:
    - cron: "2-59/5 13-21 * * 1-5"
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run, selftest, probe or backtest"
        default: "run"
        required: true

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only one agent run at a time. The wait for the next run is a separate job, so it never holds this place.
    concurrency:
      group: agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the news model's libraries
        run: pip install -q -r requirements.txt || echo "News model libraries unavailable; the agent will use word rules."
      - name: Keep the downloaded news model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: news-model-ae0eab9
      - name: Run the agent
        run: python3 agent.py ${{ github.event.inputs.command || 'run' }}
        env:
          AGENT_GITHUB_REPO: ${{ github.repository }}
          AGENT_GITHUB_OWNER: ${{ github.repository_owner }}
          AGENT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AGENT_SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          AGENT_KRAKEN_KEY: ${{ secrets.KRAKEN_API_KEY }}
          AGENT_KRAKEN_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          AGENT_RUNNER: github

  next:
    # Keeps the agent going even if GitHub's schedule is late, and even if the run above failed.
    # A newer wait replaces an older one, so scheduled runs restart a broken chain without ever starting a second.
    needs: run
    if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.command == 'run')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: agent-next
      cancel-in-progress: true
    steps:
      - name: Wait for the next check time, then queue the next run
        run: |
          python3 - <<'PY'
          import datetime, time
          now = datetime.datetime.utcnow()
          market = now.weekday() < 5 and 13 <= now.hour <= 21   # US market hours, both clock settings
          step = 5 if market else 30
          wait = ((now.minute // step + 1) * step - now.minute) * 60 - now.second + 60
          wait = max(60, min(wait, 31 * 60))
          print("Next run in %d seconds" % wait, flush=True)
          time.sleep(wait)
          PY
          gh workflow run agent.yml --ref main -f command=run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
